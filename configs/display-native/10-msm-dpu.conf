# Stable native-display baseline.  The unified GPU+DPU experiment leaves the
# physical panel black, while glamor on the separate DPU card derives the
# nonexistent msm-kms_dri.so name and crashes Xorg.  Keep DPU scanout explicit
# and software-backed until a working PRIME path is implemented.
Section "Device"
	Identifier "SM-X910 separate DPU"
	Driver "modesetting"
	Option "kmsdev" "/dev/dri/card1"
	Option "AccelMethod" "none"
EndSection

# The current command-mode panel driver does not yet resume reliably after
# Xorg powers the OLED down. Keep it lit until panel suspend/resume is fixed.
Section "ServerFlags"
	Option "BlankTime" "0"
	Option "StandbyTime" "0"
	Option "SuspendTime" "0"
	Option "OffTime" "0"
EndSection
