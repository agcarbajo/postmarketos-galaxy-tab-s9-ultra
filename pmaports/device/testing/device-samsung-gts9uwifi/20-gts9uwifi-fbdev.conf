# Temporary direct-rendering fallback for the bootloader framebuffer.
# simpledrm exposes this memory as /dev/fb0, but the modesetting DDX leaves the
# physical scanout on VT1 on this board even while X/LightDM run on VT7.
Section "Device"
	Identifier "SM-X910 boot framebuffer"
	Driver "fbdev"
	Option "fbdev" "/dev/fb0"
	Option "ShadowFB" "false"
EndSection
