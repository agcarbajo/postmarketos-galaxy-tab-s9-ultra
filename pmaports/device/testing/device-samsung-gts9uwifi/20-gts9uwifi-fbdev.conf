# Force the software-shadow path of the modesetting DDX.  X rendering through
# the fbdev mmap is correct but does not dirty the physical simpledrm scanout;
# modesetting damage tracking must copy each changed region to the KMS buffer.
Section "Device"
	Identifier "SM-X910 simpledrm"
	Driver "modesetting"
	Option "AccelMethod" "none"
	Option "ShadowFB" "true"
EndSection
