# SM-X910 mainline bring-up: keep the bootloader display pipeline alive.
#
# The v0 DTS has no native DRM/DSI driver; the panel is scanned out by the
# hardware state the bootloader left behind and simpledrm only writes into
# that framebuffer.  qcom-rpmhpd holds every power domain at its boot corner
# until sync_state(), which fires once ALL of its DT consumers have probed.
# The only consumers that never probe are the multimedia clock controllers
# (dispcc/videocc/camcc); loading their modules completes the consumer list,
# rpmhpd sync_state() drops the boot MMCX vote and the MDSS/DSI pipeline
# powers off, freezing the panel on the last frame (the boot penguins).
#
# Blacklisting only blocks udev/modalias autoload; the modules stay available
# and this file must be deleted when the real msm/DSI display stack is
# brought up.
blacklist dispcc_sm8550
blacklist videocc_sm8550
blacklist camcc_sm8550
blacklist gpucc_sm8550
